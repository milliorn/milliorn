name: Generate README stats cards

on:
  schedule:
    - cron: "0 9 * * *" # daily (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v1.1.0
        with:
          token: ${{ secrets.GH_README_STATS_TOKEN }}
          card: stats
          path: assets/github-stats.svg
          options: >
            username=milliorn
            theme=transparent
            hide_rank=true
            card_width=420

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v1.1.0
        with:
          token: ${{ secrets.GH_README_STATS_TOKEN }}
          card: top-langs
          path: assets/top-langs.svg
          options: >
            username=milliorn
            layout=compact
            langs_count=10
            theme=transparent
            card_width=420
