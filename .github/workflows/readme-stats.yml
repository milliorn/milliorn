name: Generate README stats cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/readme-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v1.1.0
        with:
          token: ${{ secrets.GH_README_STATS_TOKEN }}
          card: stats
          path: assets/github-stats.svg
          options: "username=milliorn&theme=transparent&hide_rank=true&card_width=420"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v1.1.0
        with:
          token: ${{ secrets.GH_README_STATS_TOKEN }}
          card: top-langs
          path: assets/top-langs.svg
          options: "username=milliorn&layout=compact&langs_count=10&theme=transparent&card_width=420"

      - name: Commit and push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p assets
          git add assets/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(readme): update stats cards"
          git push
